services:
  serpentcoin:
    build: .
    container_name: serpentcoin
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - serpentcoin_data:/app/data
    environment:
      - SERPENTCOIN_HOST=0.0.0.0
      - SERPENTCOIN_PORT=5000
      - SERPENTCOIN_DIFFICULTY=16

  miner:
    build: .
    container_name: serpentcoin-miner
    restart: unless-stopped
    profiles: ["miner"]
    command: python -m serpentcoin.cli.miner --node http://serpentcoin:5000 --difficulty 16

volumes:
  serpentcoin_data:
