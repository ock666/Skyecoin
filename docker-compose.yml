services:
  skyecoin:
    build: .
    container_name: skyecoin
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - skyecoin_data:/app/data
    environment:
      - SKYECOIN_HOST=0.0.0.0
      - SKYECOIN_PORT=5000
      - SKYECOIN_DIFFICULTY=16

  miner:
    build: .
    container_name: skyecoin-miner
    restart: unless-stopped
    profiles: ["miner"]
    command: python -m skyecoin.cli.miner --node http://skyecoin:5000 --difficulty 16

volumes:
  skyecoin_data:
