{% if blocks %}
<table class="block-table">
    <thead>
        <tr>
            <th>#</th>
            <th>Hash</th>
            <th>Miner</th>
            <th>Txs</th>
            <th>Nonce</th>
            <th>Difficulty</th>
        </tr>
    </thead>
    <tbody>
    {% for block in blocks %}
        <tr class="block-row" onclick="showBlockDetail({{ block.block_index }})" title="Click for details">
            <td style="color: var(--accent); font-weight: 600;">{{ block.block_index }}</td>
            <td><span class="hash short" title="{{ block.block_hash }}">{{ block.block_hash[:16] }}...</span></td>
            <td><span class="address">{{ block.miner_address[:12] }}...</span></td>
            <td>{{ block.tx_count }}</td>
            <td><span class="mono">{{ block.nonce }}</span></td>
            <td><span class="mono">{{ block.difficulty }}</span></td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% else %}
<div class="empty-state">No blocks yet. Start mining!</div>
{% endif %}
