{% if peers %}
<div class="peer-graph" id="peer-graph">
    <div class="peer-node local">
        <div class="peer-dot"></div>
        <span class="peer-label mono">this node</span>
    </div>
    {% for peer in peers %}
    <div class="peer-node">
        <div class="peer-dot"></div>
        <span class="peer-label mono">{{ peer }}</span>
    </div>
    <div class="peer-line"></div>
    {% endfor %}
</div>
{% else %}
<div class="empty-state">No peers connected. Add one to sync with other nodes!</div>
{% endif %}
